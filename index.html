<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Art with Code by Sandro Ieva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0a0a0a;--fg:#e8e4df;--fg-dim:#6b6660;--fg-muted:#3a3632;
--accent:#d4cfc8;--border:#1e1d1b;--ease:cubic-bezier(0.22,1,0.36,1);
}
html,body{background:var(--bg);color:var(--fg);font-family:'DM Sans','DM Mono',-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden;height:100vh;width:100vw;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;position:fixed;top:0;left:0;right:0;bottom:0;-webkit-tap-highlight-color:transparent}

#three-bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.3}

#gallery-view{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;transition:opacity 0.5s var(--ease),transform 0.5s var(--ease)}
#gallery-view.hidden{opacity:0;transform:scale(0.97);pointer-events:none}

.gallery-header{padding:max(28px,env(safe-area-inset-top)) 36px 20px;display:flex;align-items:baseline;justify-content:space-between;flex-shrink:0;border-bottom:1px solid var(--border)}
.gallery-header h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:32px;letter-spacing:-0.02em;color:var(--fg)}
.gallery-header h1 em{font-style:italic;color:var(--fg-dim)}
.gallery-header .meta{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-dim);font-family:'DM Mono',monospace}

.gallery-list{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--fg-muted) transparent;-webkit-overflow-scrolling:touch}
.gallery-list::-webkit-scrollbar{width:4px}
.gallery-list::-webkit-scrollbar-track{background:transparent}
.gallery-list::-webkit-scrollbar-thumb{background:var(--fg-muted);border-radius:2px}

.artwork-row{display:grid;grid-template-columns:56px 1fr 200px 48px;align-items:center;padding:0 36px;min-height:64px;border-bottom:1px solid var(--border);cursor:pointer;position:relative;overflow:hidden;transition:background 0.55s var(--ease),padding-left 0.5s var(--ease);opacity:0;transform:translateY(8px);animation:fadeRow 0.4s var(--ease) forwards;-webkit-tap-highlight-color:transparent}
.artwork-row::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(212,207,200,0.04) 0%,transparent 70%);opacity:0;transition:opacity 0.6s var(--ease)}
.artwork-row:hover::before{opacity:1}
.artwork-row:hover{background:rgba(255,255,255,0.025);padding-left:42px}
@keyframes fadeRow{to{opacity:1;transform:translateY(0)}}

.row-index{font-size:11px;color:var(--fg-muted);font-variant-numeric:tabular-nums;letter-spacing:0.04em;transition:color 0.5s var(--ease);font-family:'DM Mono',monospace}
.artwork-row:hover .row-index{color:var(--fg-dim)}
.row-title{font-family:'Instrument Serif',serif;font-size:18px;font-weight:400;color:var(--fg);letter-spacing:-0.01em;transition:color 0.5s var(--ease),letter-spacing 0.5s var(--ease);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artwork-row:hover .row-title{color:#fff;letter-spacing:0.01em}
.row-tags{font-size:10px;color:var(--fg-dim);letter-spacing:0.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color 0.5s var(--ease);font-family:'DM Mono',monospace}
.artwork-row:hover .row-tags{color:var(--fg-muted)}
.row-arrow{text-align:right;font-size:16px;color:var(--fg-muted);transition:color 0.5s var(--ease),transform 0.5s var(--ease),opacity 0.5s var(--ease);opacity:0.4}
.artwork-row:hover .row-arrow{color:var(--fg);transform:translateX(6px);opacity:1}

#artwork-view{position:fixed;inset:0;z-index:20;background:#0a0a0a;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity 0.4s var(--ease)}
#artwork-view.active{opacity:1;pointer-events:all}

.artwork-frame{flex:1;position:relative;overflow:hidden;width:100%;height:100%}
.artwork-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:#0a0a0a;opacity:0;transition:opacity 0.5s var(--ease) 0.1s}
.artwork-frame iframe.loaded{opacity:1}

/* Overlay controls ABOVE the iframe for nav & close */
.artwork-nav{position:fixed;top:max(16px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right));z-index:100;display:flex;gap:8px;pointer-events:none;opacity:0;transition:opacity 0.4s var(--ease) 0.2s}
#artwork-view.active .artwork-nav{opacity:1;pointer-events:all}
.artwork-nav button{width:44px;height:44px;border-radius:50%;background:rgba(20,20,20,0.55);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);border:1px solid rgba(255,255,255,0.1);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all 0.2s cubic-bezier(0.4,0,0.2,1);-webkit-tap-highlight-color:transparent;font-family:inherit;line-height:1}
.artwork-nav button:hover{background:rgba(30,30,30,0.7);border-color:rgba(255,255,255,0.2);transform:scale(1.04)}
.artwork-nav button:active{transform:scale(0.94)}

.artwork-title-tag{position:fixed;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:99;background:rgba(20,20,20,0.55);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);border:1px solid rgba(255,255,255,0.08);border-radius:22px;padding:10px 18px;font-family:'DM Sans',sans-serif;font-size:12px;color:rgba(255,255,255,0.85);letter-spacing:0.02em;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 0.4s var(--ease) 0.2s;max-width:calc(100vw - 200px);overflow:hidden;text-overflow:ellipsis}
#artwork-view.active .artwork-title-tag{opacity:1}

#transition-overlay{position:fixed;inset:0;z-index:200;pointer-events:none;display:flex;align-items:center;justify-content:center}
.curtain{position:absolute;inset:0;background:var(--bg);transform:scaleY(0);transform-origin:bottom}
.curtain.up{transform:scaleY(1);transform-origin:top;transition:transform 0.45s var(--ease)}
.curtain.down{transform:scaleY(0);transform-origin:top;transition:transform 0.45s var(--ease) 0.12s}
.trans-label{position:relative;z-index:2;font-family:'Instrument Serif',serif;font-size:42px;color:var(--fg);opacity:0;transform:translateY(12px);transition:opacity 0.3s ease 0.2s,transform 0.3s ease 0.2s}
.trans-label.show{opacity:1;transform:translateY(0)}

.gallery-footer{padding:14px 36px;padding-bottom:max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-muted);font-family:'DM Mono',monospace}

@media(max-width:640px){
.gallery-header{padding:max(20px,env(safe-area-inset-top)) 20px 16px}
.gallery-header h1{font-size:24px}
.gallery-header .meta{display:none}
.artwork-row{grid-template-columns:40px 1fr 48px;padding:0 20px;min-height:60px}
.row-tags{display:none}
.gallery-footer{padding:12px 20px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.trans-label{font-size:26px;padding:0 20px;text-align:center}
.artwork-nav button{width:40px;height:40px;font-size:16px}
.artwork-title-tag{max-width:calc(100vw - 140px);font-size:11px;padding:8px 14px}
}
</style>
</head>

<div class="meta">20 pieces</div>
</div>
<div class="gallery-list" id="gallery-list"></div>
<div class="gallery-footer">
<span>sandroieva.com</span>
<span>Click to explore</span>
</div>
</div>

</div>
</div>

var currentIndex = -1;
var listEl = document.getElementById("gallery-list");
artworks.forEach(function(art, i) {
  var row = document.createElement("div");
  row.className = "artwork-row";
  row.style.animationDelay = (i * 0.03) + "s";
  row.innerHTML = '<div class="row-index">' + String(i+1).padStart(2,"0") + '</div><div class="row-title">' + art.title + '</div><div class="row-tags">' + art.tags + '</div><div class="row-arrow">&#8594;</div>';
  row.addEventListener("click", function() { openArtwork(i); });
  listEl.appendChild(row);
});

var curtain = document.getElementById("curtain");
var transLabel = document.getElementById("trans-label");
var galleryView = document.getElementById("gallery-view");
var artworkView = document.getElementById("artwork-view");
var artworkIframe = document.getElementById("artwork-iframe");
var artworkTitleTag = document.getElementById("artwork-title-tag");

function loadArtwork(index) {
  var art = artworks[index];
  artworkTitleTag.textContent = String(index+1).padStart(2,"0") + " \u2014 " + art.title;
  artworkIframe.classList.remove("loaded");
  try {
    var html = atob(art.data);
    artworkIframe.srcdoc = html;
  } catch(e) {
    console.error("Failed to decode artwork", index, e);
  }
  artworkIframe.onload = function() {
    setTimeout(function() { artworkIframe.classList.add("loaded"); }, 80);
  };
}

function openArtwork(index) {
  currentIndex = index;
  transLabel.textContent = artworks[index].title;
  curtain.className = "curtain up";
  setTimeout(function() { transLabel.classList.add("show"); }, 80);
  setTimeout(function() {
    galleryView.classList.add("hidden");
    artworkView.classList.add("active");
    loadArtwork(index);
  }, 420);
  setTimeout(function() {
    transLabel.classList.remove("show");
    curtain.className = "curtain down";
  }, 650);
  setTimeout(function() { curtain.className = "curtain"; }, 1200);
}

function closeArtwork() {
  curtain.className = "curtain up";
  setTimeout(function() {
    artworkView.classList.remove("active");
    artworkIframe.srcdoc = "";
    galleryView.classList.remove("hidden");
  }, 380);
  setTimeout(function() { curtain.className = "curtain down"; }, 520);
  setTimeout(function() { curtain.className = "curtain"; }, 1100);
  currentIndex = -1;
}

function navArtwork(dir) {
  var next = currentIndex + dir;
  if (next < 0) next = artworks.length - 1;
  if (next >= artworks.length) next = 0;
  currentIndex = next;
  transLabel.textContent = artworks[next].title;
  // Quick fade transition between artworks
  curtain.className = "curtain up";
  setTimeout(function() { transLabel.classList.add("show"); }, 80);
  setTimeout(function() {
    loadArtwork(next);
  }, 300);
  setTimeout(function() {
    transLabel.classList.remove("show");
    curtain.className = "curtain down";
  }, 550);
  setTimeout(function() { curtain.className = "curtain"; }, 1100);
}

document.getElementById("btn-back").addEventListener("click", closeArtwork);
document.getElementById("btn-prev").addEventListener("click", function() { navArtwork(-1); });
document.getElementById("btn-next").addEventListener("click", function() { navArtwork(1); });
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape" && currentIndex >= 0) closeArtwork();
  if (e.key === "ArrowRight" && currentIndex >= 0) navArtwork(1);
  if (e.key === "ArrowLeft" && currentIndex >= 0) navArtwork(-1);
});

// Three.js Background
(function() {
  var canvas = document.getElementById("three-bg");
  if (!canvas || typeof THREE === "undefined") return;
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setClearColor(0x000000, 0);
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
  camera.position.z = 28;
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener("resize", resize);
  var group = new THREE.Group();
  scene.add(group);
  var geoTypes = [
    new THREE.IcosahedronGeometry(1, 0),
    new THREE.OctahedronGeometry(1, 0),
    new THREE.TetrahedronGeometry(1, 0),
    new THREE.DodecahedronGeometry(0.8, 0)
  ];
  var shapes = [];
  for (var i = 0; i < 16; i++) {
    var wireMat = new THREE.MeshBasicMaterial({ color: 0x2a2825, wireframe: true, transparent: true, opacity: 0.2 });
    var mesh = new THREE.Mesh(geoTypes[i % geoTypes.length], wireMat);
    var s = 0.4 + Math.random() * 2.0;
    mesh.scale.set(s, s, s);
    mesh.position.set((Math.random()-0.5)*42, (Math.random()-0.5)*32, (Math.random()-0.5)*18-6);
    mesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
    group.add(mesh);
    shapes.push({ mesh:mesh, rx:(Math.random()-0.5)*0.003, ry:(Math.random()-0.5)*0.004, fp:Math.random()*Math.PI*2, fs:0.15+Math.random()*0.3, fa:0.15+Math.random()*0.4 });
  }
  var gridMat = new THREE.LineBasicMaterial({ color: 0x181716, transparent: true, opacity: 0.25 });
  for (var j = -15; j <= 15; j += 3) {
    var pts = [new THREE.Vector3(j, -22, -10), new THREE.Vector3(j, 22, -10)];
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), gridMat));
  }
  var mx = 0, my = 0;
  document.addEventListener("mousemove", function(e) {
    mx = (e.clientX / window.innerWidth - 0.5) * 2;
    my = (e.clientY / window.innerHeight - 0.5) * 2;
  });
  var t = 0;
  function animate() {
    requestAnimationFrame(animate);
    t += 0.016;
    camera.position.x += (mx*2 - camera.position.x) * 0.008;
    camera.position.y += (-my*1.5 - camera.position.y) * 0.008;
    camera.lookAt(0, 0, 0);
    for (var k = 0; k < shapes.length; k++) {
      shapes[k].mesh.rotation.x += shapes[k].rx;
      shapes[k].mesh.rotation.y += shapes[k].ry;
      shapes[k].mesh.position.y += Math.sin(t * shapes[k].fs + shapes[k].fp) * shapes[k].fa * 0.008;
    }
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
